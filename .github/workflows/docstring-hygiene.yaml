# This package's public docstrings are the source for an auto-generated API
# reference. This guard rejects typographic characters in docstrings that the
# documentation build does not accept, before they merge.
# See scripts/check_docstring_hygiene.py for the rationale.

name: Docstring hygiene

on:
  pull_request:
    branches: [main]

jobs:
  docstring-hygiene:
    runs-on: cw-static-pub-x64-4c
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: ".python-version"

      - name: Check docstring hygiene
        run: uv run --no-project python scripts/check_docstring_hygiene.py
